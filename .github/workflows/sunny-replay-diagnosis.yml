name: Sunny Yard diagnosis
on:
  push:
    branches: [codex/sunny-replay-cause]
permissions:
  contents: read
jobs:
  sunny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      EBS_GPU: '0'
      EBS_REPLAY_INPUTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.17.1'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Record environment
        run: |
          mkdir -p output/sunny-replay
          { uname -a; cat /etc/os-release; node --version; npx playwright --version; ffmpeg -version; ffprobe -version; lscpu; } > output/sunny-replay/environment.log
      - name: Sunny Yard with its four original predecessors, once
        run: |
          node --test --test-concurrency=1 --test-timeout=600000 --test-name-pattern='^(Sunny Yard:|Scrap: (Canvas-Upload|UI-Regler|echte kurze)|Scrap v3:)' test/scrap-browser.test.mjs 2>&1 | tee output/sunny-replay/test.log
      - name: Separate video, audio and container
        if: always()
        run: node scripts/diagnose-sunny-replay.mjs 2>&1 | tee output/sunny-replay/analysis.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunny-replay-${{ github.sha }}
          path: output/sunny-replay/
          if-no-files-found: error
