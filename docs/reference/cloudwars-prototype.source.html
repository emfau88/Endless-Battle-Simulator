<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#86ad6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wolkenflug</title>
<style>
:root{--ink:#1f2d3d;--soft:rgba(255,255,255,.80);--sub:#4a5b6e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#86ad6a;color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);
  pointer-events:none;transition:opacity .5s;z-index:2}
.pill{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:17px;border:0;color:var(--ink);
  background:var(--soft);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 4px 14px rgba(25,45,70,.16),inset 0 0 0 1px rgba(255,255,255,.65);
  font:inherit;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px;flex:none}
#pFire.hot{background:rgba(255,236,220,.9);color:#b4471a}
#pFire.hot svg{animation:flick .5s infinite alternate}
@keyframes flick{from{transform:scale(1)}to{transform:scale(1.18) rotate(4deg)}}
.bar{width:58px;height:7px;border-radius:4px;background:rgba(31,45,61,.13);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:4px;background:#5ab35c;transition:width .35s,background .35s}
#mute{pointer-events:auto;width:34px;padding:0;justify-content:center;cursor:pointer}
#score{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 50px);text-align:center;font-size:28px;font-weight:800;
  color:#fff;text-shadow:0 2px 10px rgba(20,40,70,.45);pointer-events:none;font-variant-numeric:tabular-nums;transition:opacity .5s;z-index:2}
#score.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
#mission{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 88px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  padding:7px 13px 10px;border-radius:14px;background:var(--soft);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 4px 14px rgba(25,45,70,.16);font-weight:800;font-size:13px;white-space:nowrap;z-index:2;transition:opacity .4s,background .3s;pointer-events:none;max-width:calc(100vw - 24px)}
#mission.off{opacity:0}
#mission.done{background:rgba(214,244,200,.92)}
#mission.fail{background:rgba(255,224,214,.92)}
#mission .mbar{position:absolute;left:13px;right:13px;bottom:4px;height:3px;border-radius:2px;background:rgba(31,45,61,.12);overflow:hidden}
#mission .mbar i{display:block;height:100%;width:100%;background:#3d86d4;transition:width .3s}
#mProg{color:#2f6aa8;font-variant-numeric:tabular-nums}
#wx{padding:0 8px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 136px);transform:translate(-50%,-8px);max-width:calc(100vw - 32px);
  padding:9px 16px;border-radius:14px;background:rgba(31,45,61,.80);color:#fff;font-weight:700;font-size:14px;text-align:center;
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:4}
#toast.show{opacity:1;transform:translate(-50%,0)}
#rain{position:fixed;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  width:90px;height:90px;border-radius:50%;border:0;padding:0 0 12px;display:grid;place-items:center;color:#2c5d8f;cursor:pointer;
  background:radial-gradient(circle at 35% 28%,#fff,#e3ecf7 58%,#c3d3e6);touch-action:none;z-index:3;
  box-shadow:0 10px 26px rgba(20,40,70,.30),inset 0 -5px 12px rgba(60,90,130,.20);transition:transform .12s,opacity .3s,background .2s}
#rain svg{width:42px;height:42px}
#rain small{position:absolute;left:0;right:0;bottom:15px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
#rain.on{transform:scale(.92);color:#fff;background:radial-gradient(circle at 35% 28%,#e8f2ff,#9fc2ea 58%,#6f9bd0)}
#rain.storm{color:#fff;background:radial-gradient(circle at 35% 28%,#c9cfe0,#6d7590 58%,#454c63)}
#rain.empty{opacity:.45}
#ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;z-index:5;
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  background:linear-gradient(180deg,rgba(30,50,80,0) 35%,rgba(30,50,80,.38));transition:opacity .5s}
#ov.hide{opacity:0;pointer-events:none}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-radius:26px;padding:22px 20px 18px;box-shadow:0 20px 50px rgba(20,40,70,.32)}
.card h1{margin:0 0 4px;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.card .sub{margin:0 0 16px;color:var(--sub);font-size:15px;line-height:1.35}
.tips{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:10px}
.tips li{display:flex;gap:12px;align-items:center;font-size:14.5px;line-height:1.3}
.tips .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.tips .ic svg{width:24px;height:24px}
.big{font-size:44px;font-weight:900;text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.stats{display:flex;justify-content:center;gap:18px;color:var(--sub);font-size:14px;margin-bottom:18px}
.btn{width:100%;height:54px;border:0;border-radius:16px;cursor:pointer;background:linear-gradient(180deg,#4b96d8,#2f76b8);color:#fff;
  font:inherit;font-size:18px;font-weight:800;box-shadow:0 8px 18px rgba(47,118,184,.35)}
.btn:active{transform:translateY(1px)}
.best{margin-top:10px;text-align:center;font-size:13px;color:var(--sub)}
body.menu #hud,body.menu #score,body.menu #rain,body.menu #mission{opacity:0;pointer-events:none}
</style>
</head>
<body class="menu">
<canvas id="c"></canvas>
<div id="hud">
  <div class="pill" title="Wolkengröße"><svg viewBox="0 0 24 24"><path fill="#7fa9d6" d="M7 18.5a4.6 4.6 0 0 1-.7-9.15A6.1 6.1 0 0 1 17.9 8.6a4.95 4.95 0 0 1-.3 9.9z"/></svg><span id="hSize">10</span></div>
  <div class="pill" id="pFire" title="Aktive Brände"><svg viewBox="0 0 24 24"><path fill="#f07a2a" d="M12 2c1 3.6 5.3 5.7 5.3 10.8a5.3 5.3 0 0 1-10.6 0c0-2.1 1-3.8 2.4-4.8.1 1.8.9 2.9 2 3.2C10.9 8.4 10.7 5 12 2z"/></svg><span id="hFire">0</span></div>
  <div class="pill" id="wx" title="Wetter und Tageszeit"><svg viewBox="0 0 24 24" id="wxIc"></svg></div>
  <div style="flex:1"></div>
  <div class="pill" title="Wald"><svg viewBox="0 0 24 24"><path fill="#4f9a4a" d="M12 2 5.2 12H9l-3 5h5v5h2v-5h5l-3-5h3.8z"/></svg><div class="bar"><i id="hForest"></i></div></div>
  <button class="pill" id="mute" aria-label="Ton an oder aus"><svg viewBox="0 0 24 24" id="muteIc"></svg></button>
</div>
<div id="score">0</div>
<div id="mission" class="off"><span id="mTitle"></span><span id="mProg"></span><div class="mbar"><i id="mTime"></i></div></div>
<div id="toast"></div>
<button id="rain" aria-label="Regnen (gedrückt halten)">
  <svg viewBox="0 0 48 48"><path fill="currentColor" d="M14 27a7.5 7.5 0 0 1-1-14.93A10 10 0 0 1 32 11.6 8 8 0 0 1 34 27z"/>
  <path stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M16 32l-2 5M24 32l-2 6M32 32l-2 5"/></svg>
  <small>Regen</small>
</button>
<div id="ov"><div class="card" id="card"></div></div>

<script>
'use strict';
// ==PURE START==
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function hash2(x, y, s) {

// ---------- Gelände ----------
const LAKE = 0.35, RIVW = 0.0065, FOREST = 0.565;
function waterAmt(h, rn) {

}

}
function isForestAt(x, y) { sampleT(x, y); return T_w < -0.012 && T_f > FOREST + 0.012; }

// ==PURE END==

// ---------- Felder (gedrehte Parzellen je Region) ----------
const FANG = [0.35, -0.52, 1.08, 0.12].map(a => [Math.cos(a), Math.sin(a)]);
const FCU = 92, FCV = 58;
let F_ri = 0, F_iu = 0, F_iv = 0, F_m = false, F_v = 0, F_edge = 0, F_id = 0;

  const ri = g < 0.38 ? 0 : g < 0.52 ? 1 : g < 0.66 ? 2 : 3, cs = FANG[ri];
  const u = x * cs[0] + y * cs[1], v = -x * cs[1] + y * cs[0];
  const fu = u / FCU, fv = v / FCV, iu = Math.floor(fu), iv = Math.floor(fv), ru = fu - iu, rv = fv - iv;
  const m = hash2(iu >> 1, iv, ri + 70) < 0.35;

  const dv = Math.min(rv, 1 - rv) * FCV;

}
const cellCache = new Map();
function cellField() {
  const k = ((F_iu + 60000) * 120000 + (F_iv + 60000)) * 4 + F_ri;
  let v = cellCache.get(k);
  if (v === undefined) {

    const wx = uc * cs[0] - vc * cs[1], wy = uc * cs[1] + vc * cs[0];
    v = vnoise(wx * 0.0011 + 3, wy * 0.0011 - 8, 53) > 0.41 ? 1 : 0;
    if (cellCache.size > 60000) cellCache.clear();
    cellCache.set(k, v);

// Feldtypen: Schwelle, Farbe, Muster (0 glatt, 1 Getreide, 2 Reihen, 3 gepflügt)
const FT = [
  [0.20, 217, 194, 122, 1], [0.36, 143, 179, 94, 2], [0.48, 169, 196, 111, 2], [0.62, 166, 137, 98, 3],
  [0.73, 111, 154, 79, 2], [0.79, 228, 208, 92, 1], [0.88, 198, 180, 122, 1], [1.01, 150, 186, 101, 0]];

// ---------- Chunk-Raster (grobes Rauschgitter, dann bilinear) ----------
const CS = 256, CG = 8, CPAD = 16, GN = (CS + 2 * CPAD) / CG + 1;
const gH = new Float32Array(GN * GN), gR = new Float32Array(GN * GN), gF = new Float32Array(GN * GN), gG = new Float32Array(GN * GN);
let I_h = 0, I_r = 0, I_f = 0, I_g = 0;
function fillGrid(x0, y0) {
  for (let j = 0, k = 0; j < GN; j++) for (let i = 0; i < GN; i++, k++) {
    const wx = x0 - CPAD + i * CG, wy = y0 - CPAD + j * CG;
    sampleT(wx, wy);
    gH[k] = T_h; gR[k] = T_r; gF[k] = T_f;
    gG[k] = vnoise(wx * 0.0005 + 5, wy * 0.0005 + 9, 41);
  }
}
function interp(lx, ly) {
  const gx = (lx + CPAD) / CG, gy = (ly + CPAD) / CG;
  let i = Math.floor(gx), j = Math.floor(gy);

}

// ---------- Grundfarben pro Pixel (2 Welteinheiten je Pixel) ----------
const BR = CS / 2 + 2;
const baseCan = document.createElement('canvas'); baseCan.width = baseCan.height = BR;
const baseCtx = baseCan.getContext('2d');
const baseImg = baseCtx.createImageData(BR, BR);
function renderBase(x0, y0) {
  const D = baseImg.data;
  let p = 0, lastKey = -1, isF = 0;
  for (let py = 0; py < BR; py++) {
    const ly = (py - 1) * 2 + 1;
    for (let px = 0; px < BR; px++, p += 4) {
      const lx = (px - 1) * 2 + 1, wx = x0 + lx, wy = y0 + ly;
      interp(lx, ly);
      const w = waterAmt(I_h, I_r);
      let r, g, b;
      if (w > 0) {

        if (w < 0.0035) { const e = 1 - w / 0.0035; r += 30 * e; g += 22 * e; b += 10 * e; }
      } else {
        fieldCell(wx, wy, I_g);
        const key = F_iu * 7919 + F_iv * 104729 + F_ri;
        if (key !== lastKey) { lastKey = key; isF = cellField(); }
        const moist = I_f - 0.45;
        if (isF) {
          let ti = 0; while (F_id > FT[ti][0]) ti++;

          let m = 0.93 + 0.14 * ((F_id * 7.13) % 1);
          if (pat === 1) m *= 1 + 0.035 * Math.sin(F_v * 0.45);

          else if (pat === 3) m *= 0.9 + 0.12 * Math.sin(F_v * 1.5);
          r = ft[1] * m; g = ft[2] * m; b = ft[3] * m;

// ---------- Straßennetz (verzerrtes Gitter mit gebogenen Kanten) ----------
const RS = 560;
const nodeDryCache = new Map(), edgeCache = new Map(), villCache = new Map();
const nkey = (i, j) => (i + 4096) * 8192 + (j + 4096);

    const [ax, ay] = nodePos(i, j), [bx, by] = nodePos(i2, j2);
    const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy), off = (hash2(i, j, 306 + dir) - 0.5) * L * 0.4;

    }

function getVillage(i, j) {
  const k = nkey(i, j);
  if (villCache.has(k)) return villCache.get(k);
  let v = null;
  if (hash2(i, j, 310) < 0.6 && nodeDry(i, j)) {
    const es = [];
    let e;
    if ((e = getEdge(i, j, 0))) es.push([e, false]);
    if ((e = getEdge(i, j, 1))) es.push([e, false]);
    if ((e = getEdge(i - 1, j, 0))) es.push([e, true]);
    if ((e = getEdge(i, j - 1, 1))) es.push([e, true]);
    if (es.length) {
      const rng = mulberry32(k * 7 + 13);
      const [nx, ny] = nodePos(i, j);
      const n = 5 + Math.floor(Math.pow(rng(), 1.5) * 32);
      const houses = [];

const PAL = [

  ['#474e60', 'rgba(104,112,132,0.55)', 'rgba(150,160,184,0.35)', 'rgba(18,20,28,0.6)'],

const SPR = 1.3;

  blurCircles(g, list, P[0], R * 0.09 * sc, sc);

  for (const [x, y, r] of list) blurCircles(g, [[x - r * 0.16, y - r * 0.2, r * 0.8]], P[1], r * 0.32 * sc, sc);

const chunks = new Map();
const ckey = (cx, cy) => (cx + 32768) * 65536 + (cy + 32768);
function ensureChunks(budgetMs) {
  const [x0, y0, x1, y1] = groundBounds(160);
  const cx0 = Math.floor(x0 / CS), cx1 = Math.floor(x1 / CS), cy0 = Math.floor(y0 / CS), cy1 = Math.floor(y1 / CS);
  const need = [];
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    const c = chunks.get(ckey(cx, cy));
    if (c) c.used = frameNo;
    else need.push([cx, cy, ((cx + 0.5) * CS - cam.x) ** 2 + ((cy + 0.5) * CS - cam.y) ** 2]);
  }
  need.sort((a, b) => a[2] - b[2]);
  const t0 = performance.now();
  for (let i = 0; i < need.length; i++) {
    if (i > 0 && performance.now() - t0 > budgetMs) break;
    chunks.set(ckey(need[i][0], need[i][1]), { can: renderChunk(need[i][0], need[i][1]), used: frameNo });
  }
  const keep = Math.max(120, ((cx1 - cx0 + 1) * (cy1 - cy0 + 1) * 1.4) | 0);
  if (chunks.size > keep + 30) {
    const arr = [...chunks.entries()].sort((a, b) => a[1].used - b[1].used);
    for (let i = 0; i < arr.length - keep; i++) chunks.delete(arr[i][0]);
  }
}

// ---------- Gewitter ----------

    if (c.kind === 0 && !c.eat && !c.big && c.mass < s.mass * 0.9 && Math.hypot(c.x - s.x, c.y - s.y) < s.R * 0.6 + c.R * 0.4) startEat(c, s);

// ---------- Teilchen & Vögel ----------

// =================== Tageszeit, Wetter, Nebel ===================
const DAY_LEN = 300;
let dayT = 0.06;

const SKY = [
  [0.00, [255, 255, 255], [255, 240, 210, 0.00], 0],
  [0.40, [255, 255, 255], [255, 240, 210, 0.00], 0],
  [0.50, [255, 226, 186], [255, 170, 90, 0.10], 0],
  [0.58, [232, 178, 166], [255, 120, 80, 0.09], 0.2],
  [0.66, [140, 148, 196], [90, 100, 170, 0.02], 0.7],
  [0.80, [112, 124, 176], [60, 70, 140, 0.00], 1],
  [0.90, [206, 184, 204], [255, 190, 170, 0.08], 0.35],

  while (SKY[i + 1][0] < dayT) i++;
  const a = SKY[i], b = SKY[i + 1], t = smooth(a[0], b[0], dayT);
  for (let k = 0; k < 3; k++) LIGHT.m[k] = lerp(a[1][k], b[1][k], t);
  for (let k = 0; k < 4; k++) LIGHT.g[k] = lerp(a[2][k], b[2][k], t);
  LIGHT.night = lerp(a[3], b[3], t);
  if (weather.kind === 'gewitter') { LIGHT.m[0] *= 0.8; LIGHT.m[1] *= 0.84; LIGHT.m[2] *= 0.92; }
  if (weather.kind === 'hitze') { LIGHT.g[0] = 255; LIGHT.g[1] = 175; LIGHT.g[2] = 90; LIGHT.g[3] += 0.07; }

}
const WX_TEXT = {
  klar: 'Das Wetter beruhigt sich.', hitze: 'Hitzewelle! Felder trocknen aus, mehr Brände.',
  gewitter: 'Eine Gewitterfront zieht auf.', nebel: 'Nebel zieht auf.' };
function updateWeather(dt) {

  weather.t += dt;
  if (weather.kind === 'hitze' && Math.random() < dt * 0.12 && dryFields.filter(f => !f.done && !f.mission).length < 4) {
    const a = Math.random() * TAU, d = viewRadius() * (0.4 + Math.random());
    const f = makeDryField(player.x + Math.cos(a) * d, player.y + Math.sin(a) * d);
    if (f) dryFields.push(f);
  }
  if (weather.t < weather.dur) return;
  const opts = weather.kind === 'klar' ? ['hitze', 'gewitter', 'nebel'] : ['klar'];
  weather.kind = opts[Math.random() * opts.length | 0]; weather.t = 0;
  weather.dur = weather.kind === 'klar' ? 40 + Math.random() * 30 : 35 + Math.random() * 25;
  toast(WX_TEXT[weather.kind], 2.6);
}
let fogs = [];
function fogAmount() {

  return Math.max(dawn * 0.75, weather.kind === 'nebel' ? 1 : 0);
}
function updateFog(dt) {
  const amt = fogAmount(), vr = viewRadius(), want = Math.round(amt * 8);
  for (const f of fogs) {
    f.x += wind.x * 0.5 * dt; f.y += wind.y * 0.5 * dt;
    f.a += ((f.dead ? 0 : amt) - f.a) * Math.min(1, dt * 0.35);
  }
  const alive = fogs.filter(f => !f.dead);
  if (alive.length < want && frameNo % 10 === 0) {
    const a = Math.random() * TAU, d = vr * (0.2 + Math.random() * 1.3);
    fogs.push({ x: player.x + Math.cos(a) * d, y: player.y + Math.sin(a) * d, r: vr * (0.45 + Math.random() * 0.5), seed: Math.random() * 1e6 | 0, a: 0, dead: false });
  } else if (alive.length > want && frameNo % 30 === 0) alive[0].dead = true;
  fogs = fogs.filter(f => !(f.dead && f.a < 0.02) && Math.hypot(f.x - player.x, f.y - player.y) < vr * 2.6);
}

  for (const f of fogs) {

    const rng = mulberry32(f.seed);
    for (let k = 0; k < 7; k++) {
      const ox = (rng() - 0.5) * f.r * 1.2, oy = (rng() - 0.5) * f.r * 0.7, r = f.r * (0.35 + rng() * 0.35) * S(0.12) * DPR;
      proj(f.x + ox, f.y + oy, 0.12);

// =================== Leben am Boden: Autos, Boote, Feuerwehr ===================
let cars = [], boats = [], trucks = [], trafficT = 0;
const CARCOL = ['#e4e7ea', '#2f3a48', '#b8402f', '#3c6fa8', '#e3c34a', '#f6f6f3', '#5a6b4a', '#8a8f96'];
function edgesNear(x, y, rad) {
  const out = [], i0 = Math.floor((x - rad) / RS) - 1, i1 = Math.floor((x + rad) / RS) + 1, j0 = Math.floor((y - rad) / RS) - 1, j1 = Math.floor((y + rad) / RS) + 1;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) for (let d = 0; d < 2; d++) {
    const e = getEdge(i, j, d);
    if (e && e.x1 > x - rad && e.x0 < x + rad && e.y1 > y - rad && e.y0 < y + rad) out.push(e);
  }
  return out;
}
function villagesNear(x, y, rad) {
  const out = [], i0 = Math.floor((x - rad) / RS) - 1, i1 = Math.floor((x + rad) / RS) + 1, j0 = Math.floor((y - rad) / RS) - 1, j1 = Math.floor((y + rad) / RS) + 1;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { const v = getVillage(i, j); if (v) out.push(v); }

}
function placeOnRoad(o) {   // Rechtsverkehr: Spur neben der Mittellinie
  const p = alongEdge(o.e, o.d, false), off = 1.6 * o.dir;
  o.x = p[0] - Math.sin(p[2]) * off; o.y = p[1] + Math.cos(p[2]) * off; o.h = p[2] + (o.dir < 0 ? Math.PI : 0);
}
function continueCar(c) {
  const P = c.e.pts, ex = c.dir > 0 ? P[P.length - 2] : P[0], ey = c.dir > 0 ? P[P.length - 1] : P[1], opts = [];
  for (const e of edgesNear(ex, ey, 10)) {
    if (e === c.e) continue;
    const q = e.pts;
    if (Math.hypot(q[0] - ex, q[1] - ey) < 2) opts.push([e, 1]);
    else if (Math.hypot(q[q.length - 2] - ex, q[q.length - 1] - ey) < 2) opts.push([e, -1]);
  }
  if (!opts.length) { c.dir = -c.dir; return; }
  const [e, dir] = opts[Math.random() * opts.length | 0];
  c.e = e; c.dir = dir; c.d = dir > 0 ? 0 : e.len;
}
function dispatchTruck(f) {

  for (const e of edgesNear(f.x, f.y, 300)) {
    const P = e.pts;
    for (let s = 0; s < P.length / 2; s++) { const d = Math.hypot(P[s * 2] - f.x, P[s * 2 + 1] - f.y); if (d < bd) { bd = d; best = [e, e.cum[s]]; } }
  }

  placeOnRoad(tr); trucks.push(tr);
}
function updateTraffic(dt) {
  const vr = viewRadius(), far = vr * 1.9;
  trafficT -= dt;
  if (trafficT <= 0) {
    trafficT = 0.35;
    if (cars.length < 18) {
      const es = edgesNear(player.x, player.y, vr * 1.4);
      if (es.length) {
        const e = es[Math.random() * es.length | 0], big = Math.random() < 0.12;
        const c = { e, d: Math.random() * e.len, dir: Math.random() < 0.5 ? 1 : -1, sp: big ? 15 : 18 + Math.random() * 14, col: big ? '#d9d4c7' : CARCOL[Math.random() * CARCOL.length | 0], L: big ? 10 : 5, in: 0 };
        placeOnRoad(c); cars.push(c);
      }
    }
    if (boats.length < 4) for (let k = 0; k < 6; k++) {
      const a = Math.random() * TAU, d = Math.random() * vr * 1.4, x = player.x + Math.cos(a) * d, y = player.y + Math.sin(a) * d;
      sampleT(x, y);
      if (T_w > 0.04) { boats.push({ x, y, h: Math.random() * TAU, sp: 6 + Math.random() * 7, sail: Math.random() < 0.5, turn: Math.random() < 0.5 ? 1 : -1, trail: [], tt: 0, look: 0, in: 0 }); break; }
    }

      b.h += T_w < 0.015 ? (0.6 + Math.random() * 0.6) * b.turn : (Math.random() - 0.5) * 0.15;
    }
    b.x += Math.cos(b.h) * b.sp * dt; b.y += Math.sin(b.h) * b.sp * dt;
    b.tt -= dt;

  tone(f0, f1, gain, dur, type, delay) {

    const ac = this.ac, t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.6);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  thunder(d) {
    if (d > 1.7) return;
    const v = clamp(1 - d * 0.5, 0.15, 1);
    this.shot('lowpass', 240, 0.7, 0.5 * v, 0.04 + d * 0.15, 2.4, d * 0.8, 70);
    if (d < 0.6) this.shot('lowpass', 1000, 0.5, 0.2 * v, 0.005, 0.3, d * 0.8);
  },
  pop(r) { this.tone(460 + (1 - Math.min(1, r)) * 280, 880, 0.05, 0.16); },
  zap() { this.shot('highpass', 2400, 0.7, 0.2, 0.003, 0.3); this.tone(140, 60, 0.06, 0.35, 'sawtooth'); },
  hiss() { this.shot('bandpass', 3600, 0.6, 0.11, 0.02, 1.0, 0, 1600); },
  chime() { this.tone(784, 784, 0.04, 0.9, 'sine', 0.05); this.tone(1175, 1175, 0.03, 1.1, 'sine', 0.17); },
  alarm() { this.tone(620, 600, 0.028, 0.18, 'triangle'); this.tone(620, 600, 0.028, 0.18, 'triangle', 0.24); },
  ambient(dt) {
    if (!this.ac) return;
    const sp = Math.hypot(player.vx, player.vy);
    this.set(this.wind, 0.03 + Math.min(1, sp / 260) * 0.06, 0.4);
    let near = 0;
    for (const c of clouds) if (c.kind === 1) near = Math.max(near, 1 - Math.hypot(c.x - player.x, c.y - player.y) / (viewRadius() * 1.2));
    this.set(this.rain, (player.rain ? (player.charged > 0 ? 0.13 : 0.085) : 0) + Math.max(0, near) * 0.04, 0.15);
    let f = 0;
    for (const fi of fires) if (!fi.out) f = Math.max(f, fi.int * (1 - Math.hypot(fi.x - player.x, fi.y - player.y) / (viewRadius() * 0.9)));
    this.set(this.fire, Math.max(0, f) * (0.03 + 0.03 * Math.random()), 0.05);
  },
};
function drawMuteIcon() {
  document.getElementById('muteIc').innerHTML = '<path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/>' + (snd.muted
    ? '<path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
    : '<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>');
}
try { snd.muted = localStorage.getItem('wolkenflug-mute') === '1'; } catch (e) { /* egal */ }
drawMuteIcon();
document.getElementById('mute').addEventListener('click', () => {
  snd.init(); snd.muted = !snd.muted;
  if (snd.master) snd.master.gain.setTargetAtTime(snd.muted ? 0 : 0.8, snd.ac.currentTime, 0.05);
  try { localStorage.setItem('wolkenflug-mute', snd.muted ? '1' : '0'); } catch (e) { /* egal */ }
  drawMuteIcon();
});

// =================== Anzeige (HUD) ===================
const $ = id => document.getElementById(id);
const hSize = $('hSize'), hFire = $('hFire'), pFire = $('pFire'), hForest = $('hForest'), scoreEl = $('score'), toastEl = $('toast'), rainBtn = $('rain'), ov = $('ov'), card = $('card');
let toastT = 0;
const hudLast = {};
function toast(msg, dur) { toastEl.textContent = msg; toastEl.classList.add('show'); toastT = dur || 2; }
function bumpScore() { scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
function setIf(key, val, fn) { if (hudLast[key] !== val) { hudLast[key] = val; fn(val); } }
function hud(dt) {
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }
  if (frameNo % 4) return;
  const act = fires.filter(f => !f.out).length;
  setIf('size', Math.round(player.mass), v => hSize.textContent = v);
  setIf('fire', act, v => { hFire.textContent = v; pFire.classList.toggle('hot', v > 0); });
  setIf('forest', Math.round(forest), v => { hForest.style.width = v + '%'; hForest.style.background = v > 60 ? '#5ab35c' : v > 30 ? '#e2b33c' : '#e0583a'; });
  setIf('score', score, v => scoreEl.textContent = v.toLocaleString('de-DE'));
  setIf('rain', player.rain, v => rainBtn.classList.toggle('on', v));
  setIf('empty', player.mass <= 4.6, v => rainBtn.classList.toggle('empty', v));
  setIf('storm', player.charged > 0, v => rainBtn.classList.toggle('storm', v));
  setIf('wx', weather.kind === 'klar' ? (LIGHT.night > 0.5 ? 'mond' : 'sonne') : weather.kind, v => $('wxIc').innerHTML = WX_IC[v]);
  const m = mission, mk = !m ? 'none' : m.title + '|' + (m.id === 'village' ? Math.ceil(Math.max(0, m.time)) + ' s' : Math.min(m.goal, Math.floor(m.cnt)) + '/' + m.goal) + '|' + (m.done ? 'd' : m.failed ? 'f' : '') + ((m.done || m.failed) && missionCD < 2 ? 'h' : '');
  setIf('mission', mk, () => {
    $('mission').classList.toggle('off', !m || (!!(m.done || m.failed) && missionCD < 2));
    if (!m) return;
    $('mission').classList.toggle('done', !!m.done); $('mission').classList.toggle('fail', !!m.failed);
    $('mTitle').textContent = m.done ? 'Geschafft: ' + m.title : m.failed ? 'Verpasst: ' + m.title : m.title;
    $('mProg').textContent = m.done || m.failed ? '' : m.id === 'village' ? Math.ceil(Math.max(0, m.time)) + ' s' : m.id === 'grow' ? Math.floor(m.cnt) + '/' + m.goal : m.cnt + '/' + m.goal;
  });
  if (m && !m.done && !m.failed) $('mTime').style.width = clamp(m.time / m.max * 100, 0, 100) + '%';
}
const WX_IC = {
  sonne: '<circle cx="12" cy="12" r="4.6" fill="#f2b632"/><path stroke="#f2b632" stroke-width="2" stroke-linecap="round" d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  mond: '<path fill="#7f8fc0" d="M15.5 3a8.5 8.5 0 1 0 5.5 14.9A9 9 0 0 1 15.5 3z"/>',
  hitze: '<circle cx="12" cy="12" r="4.6" fill="#ec6a28"/><path stroke="#ec6a28" stroke-width="2" stroke-linecap="round" d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  gewitter: '<path fill="#5b6478" d="M13.5 2 5 13.5h5.5L9 22l9-12h-5.6z"/>',
  nebel: '<path stroke="#8a97a8" stroke-width="2.2" stroke-linecap="round" d="M3 8h14M6 12h15M3 16h13"/>' };

// =================== Eingabe ===================
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
const JMAX = 60;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || joy.id !== null) return;
  snd.init();
  joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  joy.x = e.clientX; joy.y = e.clientY;
  let dx = joy.x - joy.ox, dy = joy.y - joy.oy, L = Math.hypot(dx, dy);
  if (L > JMAX) { joy.ox = joy.x - dx / L * JMAX; joy.oy = joy.y - dy / L * JMAX; dx = joy.x - joy.ox; dy = joy.y - joy.oy; L = JMAX; }
  const m = L < 6 ? 0 : L / JMAX;
  input.jx = L ? dx / L * m : 0; input.jy = L ? dy / L * m : 0;
});
const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.id = null; input.jx = input.jy = 0; };
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);
const rainOn = e => { e.preventDefault(); snd.init(); input.rain = true; try { rainBtn.setPointerCapture(e.pointerId); } catch (err) { /* egal */ } };
const rainOff = () => { input.rain = false; };
rainBtn.addEventListener('pointerdown', rainOn);
rainBtn.addEventListener('pointerup', rainOff); rainBtn.addEventListener('pointercancel', rainOff); rainBtn.addEventListener('lostpointercapture', rainOff);
rainBtn.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { input.rain = true; e.preventDefault(); }
  if (e.code === 'Enter' && state !== 'play') startGame();
  input.keys[e.code] = true;
});
window.addEventListener('keyup', e => { if (e.code === 'Space') input.rain = false; input.keys[e.code] = false; });
window.addEventListener('blur', () => { input.keys = {}; input.rain = false; joy.id = null; input.jx = input.jy = 0; });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (snd.ac) document.hidden ? snd.ac.suspend() : snd.ac.resume(); });
window.addEventListener('resize', resize);

// =================== Ablauf ===================
const IC = {
  cloud: '<svg viewBox="0 0 24 24"><path fill="#6f9fd2" d="M7 18.5a4.6 4.6 0 0 1-.7-9.15A6.1 6.1 0 0 1 17.9 8.6a4.95 4.95 0 0 1-.3 9.9z"/></svg>',
  rain: '<svg viewBox="0 0 24 24"><path fill="#ec6a28" d="M12 2c1 3.6 5.3 5.7 5.3 10.8a5.3 5.3 0 0 1-10.6 0c0-2.1 1-3.8 2.4-4.8.1 1.8.9 2.9 2 3.2C10.9 8.4 10.7 5 12 2z"/></svg>',
  bolt: '<svg viewBox="0 0 24 24"><path fill="#5b6478" d="M13.5 2 5 13.5h5.5L9 22l9-12h-5.6z"/></svg>',
};
function showCard(mode) {
  if (mode === 'menu') {
    card.innerHTML = `<h1>Wolkenflug</h1>
      <p class="sub">Du bist eine kleine Wolke über dem Land. Wachse, regne und rette den Wald.</p>
      <ul class="tips">
        <li><span class="ic" style="background:#e6f0fb">${IC.cloud}</span><span><b>Ziehen</b> zum Fliegen. Kleinere Wolken einsammeln macht dich größer.</span></li>
        <li><span class="ic" style="background:#fdeee2">${IC.rain}</span><span><b>Regen</b> gedrückt halten löscht Waldbrände. Über Seen tankst du auf.</span></li>
        <li><span class="ic" style="background:#e5e8ef">${IC.bolt}</span><span><b>Gewitter:</b> größer als du? Ausweichen! Kleiner? Verschlucken für Starkregen.</span></li>
      </ul>
      <button class="btn">Losfliegen</button>
      <div class="best">${best ? 'Bestwert: ' + best.toLocaleString('de-DE') : 'Tipp: Am Rechner mit WASD und Leertaste'}</div>`;
  } else {
    card.innerHTML = `<h1>Der Wald ist verloren</h1>
      <p class="sub">Du hast ${extinguished} ${extinguished === 1 ? 'Brand' : 'Brände'} gelöscht und ${missionsDone} ${missionsDone === 1 ? 'Aufgabe' : 'Aufgaben'} geschafft. Größte Wolke: ${Math.round(maxMass)}.</p>
      <div class="big">${score.toLocaleString('de-DE')}</div>
      <div class="stats"><span>Punkte</span><span>Bestwert ${best.toLocaleString('de-DE')}</span></div>
      <button class="btn">Nochmal fliegen</button>`;
  }
  card.querySelector('.btn').addEventListener('click', startGame);
  ov.classList.remove('hide');
}
function startGame() {
  snd.init();
  const px = player.x, py = player.y;
  resetPlayer(); player.x = px; player.y = py;
  state = 'play'; playT = 0; score = 0; forest = 100; extinguished = 0; maxMass = 10; fireTimer = 7;
  fires = []; bolts = []; texts = []; trucks = []; eatPuffs = []; dryFields = [];
  mission = null; missionCD = 5; missionsDone = 0; dayT = 0.08;
  weather.kind = 'klar'; weather.t = 0; weather.dur = 45;
  clouds = clouds.filter(c => c.kind === 0 && c.mass < 25);
  for (const k in hint) delete hint[k];
  for (const k in hudLast) delete hudLast[k];
  document.body.classList.remove('menu'); ov.classList.add('hide');
  toast('Zieh irgendwo auf dem Bildschirm, um zu fliegen.', 3);
}
function gameOver() {
  state = 'over'; input.rain = false; joy.id = null; input.jx = input.jy = 0;
  best = Math.max(best, score);
  try { localStorage.setItem('wolkenflug-best', String(best)); } catch (e) { /* egal */ }
  document.body.classList.add('menu');
  toastEl.classList.remove('show');
  setTimeout(() => showCard('over'), 900);
}

// =================== Schleife ===================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  spriteBudget = 3;
  update(dt);
  if (player.charged > 0 && Math.random() < dt * 2.2) {
    const a = Math.random() * TAU, R = player.R;
    makeBolt(player.x + Math.cos(a) * R * 0.5, player.y + Math.sin(a) * R * 0.5, 1, player.x + Math.cos(a + 0.9) * R * 1.05, player.y + Math.sin(a + 0.9) * R * 1.05, 1);
    bolts[bolts.length - 1].life = 0.25;
  }
  ensureChunks(state === 'play' ? 5 : 8);
  render();
  hud(dt);
  snd.ambient(dt);
  requestAnimationFrame(frame);
}
function init() {
  // Startpunkt am Waldrand, nicht im Wasser
  for (let k = 0; k < 400; k++) {
    const x = k * 211.7, y = k * 97.3;
    sampleT(x, y);
    if (T_w < -0.03 && T_f > 0.5 && T_f < 0.55) { player.x = cam.x = x; player.y = cam.y = y; break; }
  }
  resize();
  updateWind(0);
  ensureChunks(Infinity);
  spawnClouds(true);
  showCard('menu');
  requestAnimationFrame(t => { last = t; frame(t); });
}
init();
</script>
